<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResolveJá · Central de Atendimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z' fill='%230f4c45'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tema claro único. Layout: cabeçalho com a troca de visão (Cliente, Central, Gerente), abas da visão e conteúdo em cartões. */
:root{
  --bg:#f3f5f4; --surface:#fff; --surface-2:#f8faf9; --ink:#13201e; --muted:#5a6a67; --line:#dce3e1;
  --brand:#0f4c45; --brand-soft:#e4efec; --on-brand:#fff;
  --accent:#f2b705; --accent-soft:#fdf3cf; --on-accent:#2d2200;
  --ok:#1d7f46; --ok-bg:#e1f3e8; --info:#245e9f; --info-bg:#e4edf9; --pay:#0e6f67; --pay-bg:#dcf1ee;
  --bad:#b42318; --bad-bg:#fbe8e6; --warn:#8f5200; --warn-bg:#fcefd8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4vw,2.8rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)} .small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font:600 .95rem var(--body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.wa{background:#1f9d55;color:#fff}
.btn.sm{padding:6px 11px;font-size:.84rem}
.btn.lg{padding:13px 22px;font-size:1.02rem}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.88rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto}
.hint{font-weight:400;color:var(--muted);font-size:.8rem}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-agendado,.st-aguardando,.st-retorno{background:var(--info-bg);color:var(--info)}
.st-pago,.st-em_atendimento{background:var(--pay-bg);color:var(--pay)}
.st-concluido,.st-convertida,.st-pedido{background:var(--ok-bg);color:var(--ok)}
.st-cancelado,.st-encerrada,.st-sem_pedido{background:var(--bad-bg);color:var(--bad)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.f-entrada{background:var(--info-bg);color:var(--info)}
.f-processamento{background:var(--accent-soft);color:var(--warn)}
.f-saida{background:var(--ok-bg);color:var(--ok)}
.notice{border-radius:10px;padding:11px 14px;font-size:.9rem}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}

/* Cabeçalho */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{display:flex;align-items:center;gap:16px;min-height:62px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font:800 1.25rem var(--display)}
.logo b{color:var(--brand)}
.visao{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.visao a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem}
.visao a.on{background:var(--brand);color:var(--on-brand)}
.subnav{background:var(--surface);border-bottom:1px solid var(--line)}
.subnav .wrap{display:flex;gap:4px;overflow-x:auto}
.subnav a{padding:11px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.subnav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:800;margin-left:6px}
main.wrap{padding-top:22px;padding-bottom:48px;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead p{color:var(--muted);max-width:70ch;margin-top:4px}
.foot{color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding:16px 20px 28px;text-align:center}

/* Cliente */
.cli{display:grid;grid-template-columns:1fr 1.05fr;gap:28px;align-items:start}
.cli-txt{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.pill{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:999px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.lead{font-size:1.08rem;color:var(--muted);max-width:46ch}
.passos{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.passos li{display:flex;gap:12px;align-items:flex-start}
.passos .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 .9rem var(--display)}
.art{width:100%;max-width:400px;height:auto;display:block;margin-top:6px}
.protocolo{font:800 2.2rem var(--display);letter-spacing:.04em;color:var(--brand)}
.track{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.track li{flex:1;min-width:100px;border-top:4px solid var(--line);padding-top:7px;font-size:.84rem;color:var(--muted)}
.track li.ok{border-color:var(--ok);color:var(--ink);font-weight:600}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:2rem;line-height:1;cursor:pointer;color:var(--line);padding:0 2px}
.stars button.on{color:#e0a100}
.star{color:#d99a00}

/* Central */
.central{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.fila{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.fila li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.fila li.prox{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.pos{font:800 1.3rem var(--display);color:var(--muted);width:38px;text-align:center}
.espera{font-weight:700;font-variant-numeric:tabular-nums}
.espera.alta{color:var(--bad)}
.canais{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.canal-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.canal-btn:hover{border-color:var(--brand)}
.canal-btn b{font-size:1rem}
.emcurso{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px 16px}
.at{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-t{display:flex;align-items:center;gap:10px}
.sec-t .n{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:800 .85rem var(--display);flex:none}
.aside{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
.cron{font:800 2.2rem var(--display);font-variant-numeric:tabular-nums;color:var(--brand)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:9px 10px;font:600 .88rem var(--body);color:var(--muted);cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:var(--on-brand)}
table.guia{width:100%;border-collapse:collapse;font-size:.86rem}
table.guia th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.guia td{padding:7px 8px;border-bottom:1px solid var(--line)}
table.guia tr:hover td{background:var(--surface-2)}
details.guia-box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
details.guia-box summary{cursor:pointer;font-weight:700}
.pro{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.pro.sel{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.pro .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.pay-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pay-opt{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px}
.pay-opt.on{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.pay-opt span{font-size:.76rem;color:var(--muted)}
table.calc{width:100%;border-collapse:collapse;font-size:.92rem}
table.calc td{padding:7px 0;border-bottom:1px solid var(--line)}
table.calc td.v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
table.calc tr.tot td{border-bottom:0;font-weight:800;font-size:1.1rem;padding-top:10px}
table.calc tr.neg td.v{color:var(--ok)}
.anexos{display:flex;flex-wrap:wrap;gap:8px}
.ax{position:relative;width:84px;height:84px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);overflow:hidden;display:grid;place-items:center;cursor:pointer;padding:0}
.ax img{width:100%;height:100%;object-fit:cover}
.ax .pdf{font:800 .8rem var(--body);color:var(--bad)}
.ax small{position:absolute;bottom:0;left:0;right:0;background:rgba(19,32,30,.65);color:#fff;font-size:.62rem;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addax{width:84px;height:84px;border:1px dashed var(--muted);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:.75rem;color:var(--muted);cursor:pointer;padding:4px}
.addax input{display:none}
.erros{margin:0;padding-left:18px;color:var(--bad);font-size:.86rem}

/* Tabelas e detalhe */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:720px}
table.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:var(--surface-2)}
table.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
table.tbl .nw{white-space:nowrap}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filtros label{min-width:170px}
.det{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.det .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.det .v{font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.timeline li:last-child{border-bottom:0}
.timeline time{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.doc{border:1px dashed var(--muted);border-radius:12px;padding:16px;background:var(--surface-2)}
.aviso-box{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}
.aviso-box pre{white-space:pre-wrap;font:inherit;font-size:.86rem;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}

.avatar{border-radius:50%;flex:none;display:block}
.perfil-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prof-mini{display:flex;gap:12px;align-items:center}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.rev{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.lista-simples{margin:6px 0 0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.meu-prof{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}
.dias{display:flex;gap:6px;flex-wrap:wrap}
.dia{display:flex;flex-direction:column;align-items:center;gap:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font:inherit;color:inherit;min-width:68px}
.dia b{font-size:.86rem}.dia span{font-size:.76rem;color:var(--muted)}
.dia.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}.dia.on span{color:var(--on-brand)}
.dia:disabled{opacity:.4;cursor:not-allowed}
.ordem{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:16px}
.cads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.checklist{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px}
@media (max-width:960px){.cads{grid-template-columns:1fr}}
[hidden]{display:none!important}
/* Gerente */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi>span{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi b{display:block;font:800 1.5rem var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi em{display:block;font-style:normal;font-size:.76rem;color:var(--muted);margin-top:2px}
.kpi.hl{border-left:4px solid var(--accent)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:140px 1fr 80px;gap:10px;align-items:center;font-size:.86rem}
.bar-track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;border-radius:3px}
.bar-row .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.colunas{display:grid;grid-template-columns:repeat(13,1fr);gap:6px;align-items:end;height:150px;padding-top:8px}
.coluna{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.72rem;color:var(--muted)}
.coluna .c{width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.coluna b{color:var(--ink);font-size:.75rem}
.spt{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch}
.spt .col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-top:5px solid var(--c)}
.spt .col ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:.86rem}
.spt .arrow{display:grid;place-items:center;color:var(--muted);font-size:1.3rem}
.alertas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alertas li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px;border-radius:10px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface)}
.alertas li.alta{border-left-color:var(--bad)}
.toggle{border:0;border-radius:999px;padding:4px 12px;font:700 .8rem var(--body);cursor:pointer}
.toggle.on{background:var(--ok-bg);color:var(--ok)}
.toggle.off{background:var(--bad-bg);color:var(--bad)}

/* Modal e aviso */
.modal-bg{position:fixed;inset:0;background:rgba(5,15,13,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal.wide{max-width:860px}
.modal img.full{max-width:100%;border-radius:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:90vw}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

@media (max-width:960px){
  .cli,.central,.at,.two{grid-template-columns:1fr}
  .aside{position:static}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .det{grid-template-columns:1fr 1fr}
  .pay-opts{grid-template-columns:repeat(2,1fr)}
  .spt{grid-template-columns:1fr}.spt .arrow{transform:rotate(90deg)}
  .art{display:none}
}
@media (max-width:560px){
  .fgrid,.det,.canais{grid-template-columns:1fr}
  .visao{margin-left:0;width:100%}.visao a{flex:1;text-align:center;padding:7px 6px}
  .bar-row{grid-template-columns:96px 1fr 64px}
  .timeline li{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<input type="file" id="importar" accept="application/json,.json" class="sr" aria-hidden="true" tabindex="-1">
<script>
"use strict";
/* =========================================================
   ResolveJá · Central de Atendimento (versão para GitHub Pages)
   Os dados ficam no navegador: localStorage (dados) + IndexedDB (anexos).
   Toda gravação passa por salvar() e pelo objeto ANEXOS: para usar um banco
   online no futuro, basta trocar essas duas peças.
   ========================================================= */

/* ---------- Regras de preço ---------- */
function calcular(prof,horas,urgencia,pagamento){
  const servicoBase=r2(prof.precoBase+prof.precoHora*horas);
  const adicionalUrgencia=urgencia==="alta"?r2(servicoBase*0.20):0;
  const subtotal=r2(servicoBase+adicionalUrgencia);
  const taxaPlataforma=r2(subtotal*0.10);
  const bruto=r2(subtotal+taxaPlataforma);
  const descontoPix=pagamento==="pix"?r2(bruto*0.05):0;
  const total=r2(bruto-descontoPix);
  return{precoBase:prof.precoBase,precoHora:prof.precoHora,horas,servicoBase,adicionalUrgencia,subtotal,taxaPlataforma,bruto,descontoPix,total};
}

function lerComoDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function reduzirImagem(file){
  const url=URL.createObjectURL(file);const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
  const k=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return{dataURL:c.toDataURL("image/jpeg",0.75),tipo:"image/jpeg",nome:file.name.replace(/\.[^.]+$/,"")+".jpg"};
}
async function guardarArquivos(files,ref){
  const ids=[];
  for(const f of files){
    let a;
    if(f.type.startsWith("image/")){try{a=await reduzirImagem(f)}catch(e){throw new Error(`Não foi possível ler a imagem ${f.name}.`)}}
    else if(f.type==="application/pdf"){if(f.size>2e6)throw new Error(`${f.name} passa de 2 MB. Envie um PDF menor.`);a={dataURL:await lerComoDataURL(f),tipo:f.type,nome:f.name}}
    else throw new Error(`${f.name}: envie foto (JPG, PNG) ou PDF.`);
    const id="AX-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    await ANEXOS.put(id,a.dataURL);

function avisosPendentes(){
  const L=[];const enviou=(t,tipo)=>(t.avisos||[]).some(a=>a.tipo===tipo);

    else if(t.status==="concluido"&&!enviou(t,"conclusao"))L.push({id:t.codigo,t:`Enviar o recibo a ${t.clienteNome.split(" ")[0]}`,d:`Serviço ${t.codigo} concluído${t.conclusaoPor==="profissional"?" e informado pelo profissional":""}.`});

/* ---------- Rotas ---------- */
function lerRota(hash){
  let h0="";try{h0=hash!=null?hash:location.hash}catch(e){}const h=decodeURIComponent(String(h0).replace(/^#/,""));let m;
  if(!h||h==="cliente")return{v:"cliente"};
  if(h==="cliente-consulta")return{v:"cliente-consulta"};
  if(h==="central")return{v:"central"};
  if(h==="central-atendimento")return{v:"atendimento"};
  if(h==="central-pedidos")return{v:"pedidos"};
  if((m=h.match(/^central-(RJ-\d{6})$/)))return{v:"pedido",codigo:m[1]};
  if(h==="gerente")return{v:"gerente"};
  if(h==="gerente-chamadas")return{v:"chamadas"};
  if(h==="gerente-profissionais")return{v:"profs"};
  if(h==="gerente-cadastros")return{v:"cadastros"};
  if(h==="profissional")return{v:"prof-cadastro"};
  if(h==="profissional-ordens")return{v:"prof-ordens"};
  return{v:"cliente"};
}
const lado=v=>v.startsWith("cliente")?"cliente":v.startsWith("prof-")?"profissional":["gerente","chamadas","profs","cadastros"].includes(v)?"gerente":"central";

window.addEventListener("popstate",()=>{S.modal=null;S.route=lerRota();render()});
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a||e.ctrlKey||e.metaKey||e.shiftKey)return;e.preventDefault();ir(a.getAttribute("href"))},true);

async function enviarFila(){
  const f=S.form,e=[];

function consultar(){
  const cod=S.cliente.consulta.codigo.trim().toUpperCase().replace(/\s/g,""),tel=digitos(S.cliente.consulta.telefone);
  S.cliente.nota=0;S.cliente.comentario="";

  else if(/^RJ-?\d{6}$/.test(cod)){const c="RJ-"+cod.replace(/\D/g,"");const t=D.transacoes.find(x=>x.codigo===c);S.cliente.resultado=t&&digitos(t.telefone)===tel?{codigo:c}:{erro:"Não encontramos esse pedido com esse telefone. Confira os dois e tente de novo."}}

}

function documento(t){
  const v=t.valores;let titulo,nota;

  else{titulo="Confirmação de agendamento";nota="Pagamento em dinheiro, feito ao profissional na conclusão."}

      ${!pronto3?`<p class="muted small">Escolha especialidade, urgência, data e horário para ver quem está livre.</p>`:fora?`<p class="notice warn">Começando às ${esc(a.horario)}, um serviço de ${fmtH(a.horas)} termina às ${hmDe(fim)}. O atendimento vai até as 20:00: escolha um horário mais cedo.</p>`:

function confirmarPedido(){
  const a=D.atendimentoAberto,c=a.cliente,e=[];
  if(c.nome.trim().length<3)e.push("Nome do cliente.");
  if(digitos(c.telefone).length<10)e.push("Telefone com DDD.");
  if(!c.bairro)e.push("Bairro.");
  if(c.endereco.trim().length<5)e.push("Endereço.");
  if(a.descricao.trim().length<5)e.push("Descrição do problema.");
  if(!a.servico)e.push("Especialidade (triagem).");
  if(!a.urgencia)e.push("Urgência (triagem).");
  if(!a.data||!a.horario)e.push("Data e horário.");
  else if(horaPassou(a.data,a.horario))e.push("O horário escolhido já passou.");
  const ini=a.horario?minDe(a.horario):0,fim=ini+Math.round(a.horas*60);
  if(a.horario&&fim>FIM_EXPEDIENTE)e.push("O serviço passaria das 20:00.");
  const prof=D.profs.find(p=>p.id===a.profId);
  if(!prof)e.push("Escolha o profissional.");
  else if(!prof.disponivel||sobrepoe(prof.id,a.data,ini,fim))e.push("O profissional escolhido não está mais livre nesse horário.");
  if(e.length){a.erros=e;salvar();render();toast("Confira os itens destacados no resumo.","bad");return}
  const agora=agoraISO();const{cli,novo}=clienteUpsert(c);
  const codigo=proximoCodigo();
  const t=montarTransacao({codigo,cliente:cli,descricao:a.descricao.trim(),servico:a.servico,urgencia:a.urgencia,horas:a.horas,data:a.data,horario:a.horario,prof,pagamento:a.pagamento,canal:a.canal,atendimentoId:a.id,filaId:a.filaId,anexos:a.anexos,criadoEm:agora});
  t.eventos.splice(1,0,{...ev("processamento",novo?"Novo cliente cadastrado.":"Cadastro do cliente atualizado.",agora),em:t.eventos[0].em});
  for(const id of a.anexos){const ax=D.anexos.find(x=>x.id===id);if(ax&&ax.ref.tipo!=="transacao")ax.ref={tipo:"transacao",id:codigo}}
  D.transacoes.push(t);
  fecharAtendimento("pedido","",codigo);
  render();
  const dur=D.atendimentos.at(-1).duracaoSeg;const refazer=()=>`<p>O atendimento durou <b>${fmtDur(dur)}</b> e foi registrado no monitoramento. Agora avise o cliente e envie a ordem de serviço ao profissional.</p><div class="two">${caixaAviso("confirmacao",t,"Avisar o cliente: confirmação")}${caixaProf(t,true)}</div>`;
  abrirModal({titulo:`Pedido ${codigo} criado`,wide:true,refazer,html:refazer(),botoes:[{rotulo:"Voltar à fila",classe:"ghost",acao:()=>{fecharModal();ir("central")}},{rotulo:"Abrir o pedido",acao:()=>{fecharModal();location.hash="central-"+codigo}}]});
}
function fecharAtendimento(resultado,motivo,transacaoId){
  const a=D.atendimentoAberto;const fim=agoraISO();const dur=Math.round((Date.now()-new Date(a.inicio))/1000);
  D.atendimentos.push({id:a.id,canal:a.canal,inicio:a.inicio,fim,duracaoSeg:dur,esperaSeg:a.esperaSeg,clienteNome:a.cliente.nome||"(sem nome)",telefone:digitos(a.cliente.telefone),resultado,motivo,transacaoId:transacaoId||null,filaId:a.filaId,seed:false});
  if(a.filaId){const f=D.fila.find(x=>x.id===a.filaId);if(f){if(resultado==="pedido"){f.status="convertida";f.transacaoId=transacaoId;f.finalizadoEm=fim}else if(resultado==="retorno"){f.status="aguardando";f.tentativas=(f.tentativas||0)+1;f.criadoEm=fim}else{f.status="encerrada";f.motivo=motivo;f.finalizadoEm=fim}}}
  D.atendimentoAberto=null;salvar();
}
function encerrarSemPedido(){
  const a=D.atendimentoAberto;
  abrirModal({titulo:`Encerrar ${a.id} sem pedido`,html:`<p class="muted">O contato fica registrado no monitoramento com o motivo escolhido.</p><div class="stack">${MOTIVOS.map((m,i)=>`<label class="row small" style="flex-wrap:nowrap"><input type="radio" name="motivo" value="${i}" ${i===0?"checked":""}> ${esc(m)}${i===4&&!a.filaId?" <span class='muted'>(só para quem veio da fila)</span>":""}</label>`).join("")}</div>`,
    botoes:[{rotulo:"Voltar",classe:"ghost",acao:fecharModal},{rotulo:"Encerrar atendimento",classe:"danger",acao:()=>{const i=Number((document.querySelector("input[name=motivo]:checked")||{}).value||0);const ret=i===4&&a.filaId;fecharAtendimento(ret?"retorno":"sem_pedido",MOTIVOS[i]);fecharModal();toast(ret?"Cliente voltou para a fila.":"Atendimento encerrado e registrado.");location.hash="central"}}]});
}

  const q=S.pedidos.q.trim().toLowerCase(),st=S.pedidos.status;

  <div class="card stack">

function metricas(){
  const T=D.transacoes,conc=T.filter(t=>t.status==="concluido");
  const fat=r2(conc.reduce((a,t)=>a+t.valores.total,0)),rec=r2(conc.reduce((a,t)=>a+t.valores.taxaPlataforma-t.valores.descontoPix,0));
  const av=T.filter(t=>t.avaliacao);
  return{total:T.length,concluidos:conc.length,andamento:T.filter(ativa).length,cancelados:T.filter(t=>t.status==="cancelado").length,faturamento:fat,receita:rec,ticket:conc.length?r2(fat/conc.length):0,nota:av.length?r2(media(av.map(t=>t.avaliacao.nota))):0,nAval:av.length,
    porEsp:Object.keys(ESPEC).map(k=>({nome:ESPEC[k],pedidos:T.filter(t=>t.servico===k).length,fat:r2(conc.filter(t=>t.servico===k).reduce((a,t)=>a+t.valores.total,0))})),
    porStatus:Object.keys(STATUS).map(k=>({k,n:T.filter(t=>t.status===k).length,valor:r2(T.filter(t=>t.status===k).reduce((a,t)=>a+t.valores.total,0))})),
    porPag:Object.keys(PAG).map(k=>({nome:PAG[k],n:T.filter(t=>t.pagamento===k).length,valor:r2(T.filter(t=>t.pagamento===k&&t.status!=="cancelado").reduce((a,t)=>a+t.valores.total,0))}))};
}
function barras(itens,campo,fmt,cor){const max=Math.max(1,...itens.map(i=>i[campo]));return`<div class="bars">${itens.map(i=>`<div class="bar-row"><span>${esc(i.nome)}</span><div class="bar-track"><div class="bar-fill" style="width:${(i[campo]/max*100).toFixed(1)}%;background:${cor}"></div></div><span class="v">${fmt(i[campo])}</span></div>`).join("")}</div>`}
function vGerente(){
  const m=metricas();const ev=D.transacoes.flatMap(t=>t.eventos);const c=f=>ev.filter(e=>e.fase===f).length;
  return`<div class="pagehead"><div><h1>Indicadores</h1><p>Resultado dos pedidos processados pela central. Todos os números vêm dos pedidos registrados neste sistema.</p></div></div>
  <div class="kpis">

function atendPeriodo(){
  const p=S.cham.periodo,lim=p==="hoje"?new Date(hojeISO()+"T00:00:00"):p==="7d"?new Date(new Date(hojeISO()+"T00:00:00").getTime()-6*864e5):new Date(0);
  return D.atendimentos.filter(a=>new Date(a.fim)>=lim);
}
function alertas(){
  const L=[];const agora=Date.now();
  for(const f of filaAguardando()){const m=(agora-new Date(f.criadoEm))/6e4;if(m>15)L.push({alta:m>30,t:`${f.nome} (${f.id}) espera há ${Math.round(m)} min na fila`,d:"Meta: retorno em até 15 minutos."})}
  const a=D.atendimentoAberto;if(a){const m=(agora-new Date(a.inicio))/6e4;if(m>15)L.push({alta:false,t:`Atendimento ${a.id} aberto há ${Math.round(m)} min`,d:"Atendimentos longos seguram a fila."})}
  for(const t of D.transacoes.filter(ativa)){const fim=new Date(t.data+"T00:00:00").getTime()+t.fimMin*6e4;if(fim<agora)L.push({alta:true,t:`Pedido ${t.codigo} passou do horário sem conclusão`,d:`${t.profissionalNome}, ${fmtData(t.data)} às ${t.horario}. Confirme e registre a conclusão ou o cancelamento.`,id:t.codigo})}
  for(const t of D.transacoes.filter(ativa)){const sit=situacaoOrdem(t);const min=(agora-new Date(t.criadoEm))/6e4;if(sit!=="confirmada"&&min>30){const ate=new Date(t.data+"T"+t.horario+":00").getTime()-agora;L.push({alta:sit==="recusada"||ate<24*36e5,t:`Pedido ${t.codigo}: ${sit==="recusada"?"profissional recusou, troque o profissional":sit==="nao_enviada"?"ordem não enviada ao profissional":"profissional ainda não confirmou"}`,d:`${t.profissionalNome}, ${fmtData(t.data)} às ${t.horario}. Envie a ordem ou ligue para confirmar.`,id:t.codigo})}}
  const ap=atendPeriodo();if(ap.length>=5){const c=ap.filter(x=>x.resultado==="pedido").length/ap.length;if(c<.4)L.push({alta:false,t:`Conversão baixa no período: ${Math.round(c*100)}%`,d:"Menos de 4 em cada 10 contatos viraram pedido."})}
  for(const k of Object.keys(ESPEC))if(!D.profs.some(p=>p.especialidade===k&&p.disponivel))L.push({alta:true,t:`Nenhum ${ESPEC[k].toLowerCase()} disponível`,d:"Pedidos dessa especialidade não podem ser agendados."});
  return L.sort((x,y)=>y.alta-x.alta);
}

function abrirDados(){
  const tam=(()=>{try{return(localStorage.getItem(CHAVE)||"").length}catch(e){return 0}})();
  abrirModal({titulo:"Dados do sistema",html:`<p class="muted small">Os dados ficam guardados neste navegador (${(tam/1024).toFixed(0)} KB de pedidos e cadastros, ${D.anexos.length} anexo(s)). Outro computador ou celular tem os próprios dados.</p>
    <div class="stack"><div class="row between"><div><b>Exportar</b><p class="muted small">Baixa um arquivo com tudo, inclusive anexos. Serve de cópia de segurança ou para levar a outro aparelho.</p></div><button class="btn ghost" data-action="exportar">Exportar</button></div>

async function exportar(){
  const ax={};for(const a of D.anexos){const v=await ANEXOS.get(a.id);if(v)ax[a.id]=v}
  const blob=new Blob([JSON.stringify({app:"resolveja-central",versao:1,exportadoEm:agoraISO(),dados:D,anexos:ax})],{type:"application/json"});
  const url=URL.createObjectURL(blob);const l=document.createElement("a");l.href=url;l.download=`resolveja-dados-${hojeISO()}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast("Arquivo exportado. Confira a pasta de downloads.");
}
document.getElementById("importar").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.app!=="resolveja-central"||!j.dados||j.dados.versao!==1)throw new Error("arquivo");
    await ANEXOS.limpar();for(const[id,v]of Object.entries(j.anexos||{}))await ANEXOS.put(id,v);
    D=j.dados;salvar();fecharModal();render();toast("Dados importados.")}
  catch(err){toast("Esse arquivo não é uma exportação válida do sistema ResolveJá.","bad")}
});

function setPath(path,val){const ks=path.split(".");let o=ks[0]==="at"?D.atendimentoAberto:ks[0]==="form"?S.form:S;const resto=ks[0]==="at"||ks[0]==="form"?ks.slice(1):ks;for(let i=0;i<resto.length-1;i++)o=o[resto[i]];o[resto.at(-1)]=val}
document.addEventListener("input",e=>{
  const el=e.target,p=el.dataset&&el.dataset.bind;if(!p)return;
  let v=el.type==="checkbox"?el.checked:el.value;
  if(el.dataset.type==="num"){v=Number(String(v).replace(",","."));if(!isFinite(v)||v<=0)return;v=Math.min(8,Math.max(0.5,Math.round(v*2)/2))}
  setPath(p,v);
  if(p==="at.data"){const w=document.getElementById("aviso-data");if(w){const ruim=v&&v<hojeISO();w.hidden=!ruim;w.textContent=ruim?`A data ${fmtData(v)} já passou. Escolha hoje ou uma data futura.`:""}}
  if(p.startsWith("at.")){if(["at.servico","at.data","at.horario","at.horas"].includes(p))D.atendimentoAberto.profId=null;D.atendimentoAberto.erros=null;salvar()}
  if(el.dataset.live){const b=document.getElementById("tabela");if(b)b.innerHTML=tabelaPedidos([...D.transacoes].filter(t=>(!S.pedidos.status||t.status===S.pedidos.status)&&(!S.pedidos.q||(t.codigo+t.clienteNome+t.profissionalNome).toLowerCase().includes(S.pedidos.q.toLowerCase()))).sort((a,b)=>a.criadoEm<b.criadoEm?1:-1))}
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.agendar){const a=D.atendimentoAberto;if(a&&a.data&&a.horario&&horaPassou(a.data,a.horario))a.horario="";agendarRender()}
  if(el.dataset&&el.dataset.rerender){if(el.id==="a-data"){const a=D.atendimentoAberto;if(a.data&&a.horario&&horaPassou(a.data,a.horario))a.horario=""}setTimeout(render,0)}
  if(el.dataset&&el.dataset.type==="num"&&D.atendimentoAberto)el.value=D.atendimentoAberto.horas;
  if(el.dataset&&el.dataset.upload&&el.files.length){
    const files=[...el.files];el.value="";
    try{
      if(el.dataset.upload==="form"){for(const f of files.slice(0,3-S.form.anexos.length)){let a;if(f.type.startsWith("image/"))a=await reduzirImagem(f);else if(f.type==="application/pdf"&&f.size<=2e6)a={dataURL:await lerComoDataURL(f),tipo:f.type,nome:f.name};else throw new Error(`${f.name}: envie foto ou PDF de até 2 MB.`);S.form.anexos.push(a)}render();return}
      if(el.dataset.upload==="cad"){for(const f of files.slice(0,3-S.cad.anexos.length)){let a;if(f.type.startsWith("image/"))a=await reduzirImagem(f);else if(f.type==="application/pdf"&&f.size<=2e6)a={dataURL:await lerComoDataURL(f),tipo:f.type,nome:f.name};else throw new Error(`${f.name}: envie foto ou PDF de até 2 MB.`);S.cad.anexos.push(a)}render();return}
      if(el.dataset.upload==="atendimento"){const a=D.atendimentoAberto;const ids=await guardarArquivos(files,{tipo:"atendimento",id:a.id});a.anexos.push(...ids);salvar();render();toast(`${ids.length} anexo(s) adicionado(s).`);return}
      if(el.dataset.upload==="pedido"){const t=D.transacoes.find(x=>x.codigo===el.dataset.id);const ids=await guardarArquivos(files,{tipo:"transacao",id:t.codigo});t.anexos.push(...ids);t.eventos.push(ev("entrada",`${ids.length} anexo(s) adicionado(s) ao pedido.`));salvar();render();toast("Anexo adicionado ao pedido.");return}
    }catch(err){toast(err.message||"Não foi possível anexar o arquivo.","bad")}
  }
});

    case"escolherData":{const at=D.atendimentoAberto;at.data=v;if(at.horario&&horaPassou(at.data,at.horario))at.horario="";at.profId=null;at.erros=null;salvar();render();break}
    case"profAceitar":{const t=D.transacoes.find(x=>x.codigo===id);t.ordem=t.ordem||{enviadaEm:t.criadoEm,meio:"sistema"};t.ordem.confirmadaEm=agoraISO();t.ordem.confirmadaPor="profissional";
      t.eventos.push(ev("entrada",`${t.profissionalNome} aceitou a ordem de serviço na área do profissional.`),ev("processamento","Pedido atualizado: profissional confirmado."),ev("saida",`Cliente passa a ver “Profissional confirmou” na consulta do pedido; aviso pronto na central.`));salvar();render();toast("Serviço aceito. A central e o cliente já estão vendo a confirmação.");break}
    case"profRecusar":{const t=D.transacoes.find(x=>x.codigo===id);const M=["Já tenho outro compromisso nesse horário","Endereço muito distante","Serviço fora da minha especialidade","Outro motivo"];
      abrirModal({titulo:`Recusar ${id}?`,html:`<p class="muted small">A central será avisada na hora para escolher outro profissional para o cliente.</p><div class="stack">${M.map((m,i)=>`<label class="row small"><input type="radio" name="mrec" value="${esc(m)}" ${i===0?"checked":""}> ${esc(m)}</label>`).join("")}</div>`,
        botoes:[{rotulo:"Voltar",classe:"ghost",acao:fecharModal},{rotulo:"Recusar serviço",classe:"danger",acao:()=>{const m=(document.querySelector('input[name="mrec"]:checked')||{}).value||"Outro motivo";t.ordem=t.ordem||{enviadaEm:t.criadoEm,meio:"sistema"};t.ordem.recusadaEm=agoraISO();t.ordem.motivoRecusa=m;
          t.eventos.push(ev("entrada",`${t.profissionalNome} recusou a ordem de serviço: ${m}.`),ev("saida","Central alertada para trocar o profissional."));salvar();fecharModal();render();toast("Recusa enviada à central.")}}]});break}
    case"profConcluir":{const t=D.transacoes.find(x=>x.codigo===id);confirmar(`Informar a conclusão de ${id}?`,`Confirme que terminou o serviço na casa de ${t.clienteNome}.${t.pagamento==="dinheiro"?` Você recebeu ${brl(t.valores.total)} em dinheiro.`:""} A central envia o recibo e pede a avaliação ao cliente.`,"Informar conclusão",()=>{aplicarConclusao(t,agoraISO(),"profissional");salvar();fecharModal();render();toast("Conclusão enviada. Obrigado!")});break}
    case"abaCad":S.cads.aba=v;render();break;
    case"checkCad":{const c=D.candidaturas.find(x=>x.id===id);c.checks[v]=el.checked;c.historico.push({em:agoraISO(),texto:`${el.checked?"Conferido":"Desmarcado"}: ${CHECKS.find(x=>x[0]===v)[1]}.`});salvar();setTimeout(render,0);break}
    case"aprovarCad":{const c=D.candidaturas.find(x=>x.id===id);confirmar(`Aprovar ${c.nome}?`,`${c.nome} passa a aparecer para a central como ${ESPEC[c.especialidade].toLowerCase()} disponível em ${c.bairro}, marcado como novo na plataforma. Depois envie a mensagem de boas-vindas.`,"Aprovar cadastro",()=>{aprovarCad(c);salvar();fecharModal();S.cads.aba="aprovada";render();toast(`${c.nome} aprovado e ativo na plataforma.`)});break}
    case"recusarCad":{const c=D.candidaturas.find(x=>x.id===id);
      abrirModal({titulo:`Recusar o cadastro de ${c.nome}?`,html:`<div class="stack">${MOTIVOS_CAD.map((m,i)=>`<label class="row small"><input type="radio" name="mcad" value="${esc(m)}" ${i===0?"checked":""}> ${esc(m)}</label>`).join("")}</div>`,
        botoes:[{rotulo:"Voltar",classe:"ghost",acao:fecharModal},{rotulo:"Recusar cadastro",classe:"danger",acao:()=>{const m=(document.querySelector('input[name="mcad"]:checked')||{}).value;c.status="recusada";c.motivo=m;c.analisadoEm=agoraISO();c.historico.push({em:agoraISO(),texto:`Cadastro recusado: ${m.toLowerCase()}.`});salvar();fecharModal();S.cads.aba="recusada";render();toast("Cadastro recusado. Envie a mensagem ao profissional.")}}]});break}
    case"trocarProf":abrirTroca(D.transacoes.find(x=>x.codigo===id));break;
    case"confirmarTroca":{const t=D.transacoes.find(x=>x.codigo===id);const p=D.profs.find(x=>x.id===v);trocarProfissional(t,p);salvar();fecharModal();render();toast(`Profissional trocado para ${p.nome}. A ordem já está na área dele.`);break}
    case"novoPedidoCliente":S.cliente.ultimo=null;render();break;
    case"prepConsulta":{const f=D.fila.find(x=>x.id===id);S.cliente.consulta={codigo:f.id,telefone:fmtTel(f.telefone)};S.cliente.resultado={fila:f.id};S.cliente.ultimo=null;break}
    case"verPedidoCliente":S.cliente.consulta.codigo=id;S.cliente.resultado={codigo:id};render();break;
    case"notaCliente":S.cliente.nota=Number(v);render();break;
    case"avaliarCliente":{const t=D.transacoes.find(x=>x.codigo===id);if(!t||t.avaliacao||t.status!=="concluido")break;aplicarAvaliacao(t,S.cliente.nota,S.cliente.comentario,agoraISO(),"cliente",D.profs.find(p=>p.id===t.profissionalId));salvar();S.cliente.nota=0;S.cliente.comentario="";render();toast("Obrigado! Sua avaliação foi registrada.");break}
    case"chamarProximo":{const f=filaAguardando()[0];if(f&&!D.atendimentoAberto)abrirAtendimento("formulario",f);break}
    case"atenderFila":{const f=D.fila.find(x=>x.id===id);if(f&&!D.atendimentoAberto)abrirAtendimento("formulario",f);break}
    case"novoAtendimento":if(!D.atendimentoAberto)abrirAtendimento(v,null);break;
    case"usarGuia":{const g=GUIA[Number(el.dataset.i)];const at=D.atendimentoAberto;at.servico=g[1];at.urgencia=g[2];at.horas=g[3];at.profId=null;at.erros=null;salvar();render();toast(`Triagem preenchida: ${ESPEC[g[1]]}, urgência ${URG[g[2]].toLowerCase()}, ${fmtH(g[3])}. Ajuste se precisar.`);break}
    case"urgencia":D.atendimentoAberto.urgencia=v;D.atendimentoAberto.erros=null;salvar();render();break;
    case"escolherProf":D.atendimentoAberto.profId=id;D.atendimentoAberto.erros=null;salvar();render();break;
    case"pagamento":D.atendimentoAberto.pagamento=v;salvar();render();break;
    case"confirmarPedido":confirmarPedido();break;
    case"encerrarSemPedido":encerrarSemPedido();break;
    case"filtroStatus":S.pedidos.status=v;render();break;
    case"abrirPedido":ir("central-"+id);break;
    case"concluir":{const t=D.transacoes.find(x=>x.codigo===id);confirmar(`Registrar a conclusão de ${id}?`,`Confirme que ${t.profissionalNome} terminou o serviço.${t.pagamento==="dinheiro"?` O pagamento em dinheiro de ${brl(t.valores.total)} será registrado.`:""} O recibo é gerado e a mensagem de conclusão fica pronta para enviar.`,"Registrar conclusão",()=>{aplicarConclusao(t,agoraISO());salvar();fecharModal();render();toast("Conclusão registrada. Envie o recibo ao cliente.")});break}
    case"cancelar":{const t=D.transacoes.find(x=>x.codigo===id);confirmar(`Cancelar ${id}?`,`O horário de ${t.profissionalNome} será liberado.${t.pagamentoStatus==="pago"?` O pagamento de ${brl(t.valores.total)} será estornado (simulação).`:""} Essa ação não pode ser desfeita.`,"Cancelar pedido",()=>{aplicarCancelamento(t,"cliente (pela central)",agoraISO());salvar();fecharModal();render();toast("Pedido cancelado e horário liberado.")},true);break}
    case"avaliarCentral":{const t=D.transacoes.find(x=>x.codigo===id);S.notaCentral=0;
      abrirModal({titulo:`Avaliação de ${t.profissionalNome}`,html:`<p class="muted small">Registre a nota que o cliente deu por telefone ou WhatsApp.</p><div class="stars" id="notaCentral">${[1,2,3,4,5].map(i=>`<button type="button" data-action="notaCentral" data-v="${i}" aria-label="${i} estrela${i>1?"s":""}">★</button>`).join("")}</div><label class="f" for="nc-com">Comentário do cliente (opcional)<textarea id="nc-com" style="min-height:60px"></textarea></label>`,
        botoes:[{rotulo:"Voltar",classe:"ghost",acao:fecharModal},{rotulo:"Registrar avaliação",acao:()=>{if(!S.notaCentral){toast("Escolha uma nota de 1 a 5.","bad");return}aplicarAvaliacao(t,S.notaCentral,(document.getElementById("nc-com")||{}).value||"",agoraISO(),"central",D.profs.find(p=>p.id===t.profissionalId));salvar();fecharModal();render();toast("Avaliação registrada.")}}]});break}
    case"notaCentral":S.notaCentral=Number(v);document.querySelectorAll("#notaCentral button").forEach((b,i)=>b.classList.toggle("on",i<S.notaCentral));break;
    case"verPerfil":abrirPerfil(id,el.dataset.modo);break;
    case"confirmarProf":{const t=D.transacoes.find(x=>x.codigo===id);t.ordem=t.ordem||{};t.ordem.confirmadaEm=agoraISO();t.eventos.push(ev("entrada",`${t.profissionalNome} confirmou a ordem de serviço (registrado pela central).`));salvar();if(S.modal&&S.modal.refazer){S.modal.html=S.modal.refazer();renderLayer()}else{if(S.modal)fecharModal();render()}toast("Confirmação do profissional registrada.");break}
    case"registrarAviso":if(el.dataset.alvo==="prof"){const t=D.transacoes.find(x=>x.codigo===id);t.ordem=t.ordem||{};const agora=agoraISO();
      if(el.dataset.tipo==="cancelProf"){t.ordem.cancelAvisadoEm=agora;t.eventos.push(ev("saida",`Cancelamento avisado a ${t.profissionalNome} por ${el.dataset.meio}.`))}
      else{t.ordem.enviadaEm=agora;t.ordem.meio=el.dataset.meio;t.eventos.push(ev("saida",`Ordem de serviço enviada a ${t.profissionalNome} por ${el.dataset.meio}.`))}
      salvar();setTimeout(()=>{if(S.modal&&S.modal.refazer){S.modal.html=S.modal.refazer();renderLayer();return}render()},300);break}
    {const t=D.transacoes.find(x=>x.codigo===id);t.avisos=t.avisos||[];t.avisos.push({tipo:el.dataset.tipo,meio:el.dataset.meio,em:agoraISO()});t.eventos.push(ev("saida",`Aviso de ${NOME_AVISO[el.dataset.tipo]} enviado ao cliente por ${el.dataset.meio}.`));salvar();setTimeout(()=>{if(S.modal&&S.modal.refazer){S.modal.html=S.modal.refazer();renderLayer();return}render()},300);break}
    case"copiarAviso":if(el.dataset.alvo==="prof"){const t=D.transacoes.find(x=>x.codigo===id);try{await navigator.clipboard.writeText(mensagemProf(el.dataset.tipo,t));t.ordem=t.ordem||{};if(el.dataset.tipo==="cancelProf"){t.ordem.cancelAvisadoEm=agoraISO();t.eventos.push(ev("saida",`Cancelamento copiado para enviar a ${t.profissionalNome}.`))}else{t.ordem.enviadaEm=agoraISO();t.ordem.meio="texto copiado";t.eventos.push(ev("saida",`Ordem de serviço copiada para enviar a ${t.profissionalNome}.`))}salvar();toast("Texto copiado. Cole na conversa com o profissional.");if(!S.modal)render()}catch(err){toast("O navegador não permitiu copiar.","bad")}break}
    {const t=D.transacoes.find(x=>x.codigo===id);const m=mensagem(el.dataset.tipo,t);try{await navigator.clipboard.writeText(m.texto);t.avisos=t.avisos||[];t.avisos.push({tipo:el.dataset.tipo,meio:"texto copiado",em:agoraISO()});t.eventos.push(ev("saida",`Mensagem de ${NOME_AVISO[el.dataset.tipo]} copiada para envio ao cliente.`));salvar();toast("Texto copiado. Cole no WhatsApp ou no e-mail.")}catch(err){toast("O navegador não permitiu copiar. Selecione o texto e copie manualmente.","bad")}break}
    case"verAnexo":{const ax=D.anexos.find(x=>x.id===id);const val=await ANEXOS.get(id);if(!ax||!val){toast("Anexo não encontrado neste navegador.","bad");break}
      if(ax.tipo==="application/pdf"){try{const b=await(await fetch(val)).blob();const u=URL.createObjectURL(b);const w=window.open(u,"_blank");if(!w)toast("Permita pop-ups para abrir o PDF.","bad")}catch(err){toast("Não foi possível abrir o PDF.","bad")}}
      else abrirModal({titulo:ax.nome,wide:true,html:`<img class="full" src="${val}" alt="${esc(ax.nome)}"><p class="muted small">Anexado em ${fmtDH(ax.criadoEm)}.</p>`});break}
    case"periodo":S.cham.periodo=v;render();break;
    case"disp":{const p=D.profs.find(x=>x.id===id);p.disponivel=!p.disponivel;salvar();render();toast(`${p.nome} agora está ${p.disponivel?"disponível":"indisponível"}.`);break}
  }
});
/* atualiza os cronômetros a cada segundo sem redesenhar a página */
setInterval(()=>{document.querySelectorAll("[data-desde]").forEach(x=>{x.textContent=relogio((Date.now()-new Date(x.dataset.desde))/1000)})},1000);
/* mantém abas abertas em sincronia (ex.: cliente numa aba, central em outra) */
window.addEventListener("storage",e=>{if(e.key===CHAVE&&e.newValue){try{D=JSON.parse(e.newValue);agendarRender()}catch(err){}}});

/* ---------- Início ---------- */
(async function(){carregar();await ANEXOS.abrir();S.route=lerRota();render()})();
</script>
</body>
</html>
